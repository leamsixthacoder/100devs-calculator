<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section class="body">
        <div class="input-container">
            <input type="text" id="input">
        </div>
        <div class="button-container">
            <div class="number-container">
                <button class="buttons seven">7</button>
                <button class="buttons eight">8</button>
                <button class="buttons nine">9</button>
                <button class="buttons divi">/</button>
            </div>
            <div class="number-container">
                <button class="buttons four">4</button>
                <button class="buttons five">5</button>
                <button class="buttons six">6</button>
                <button class="buttons mult">x</button>
            </div>
            <div class="number-container">
                <button class="buttons one">1</button>
                <button class="buttons two">2</button>
                <button class="buttons three">3</button>
                <button class="buttons add">+</button>
            </div>
            <div class="number-container">
                <button class="buttons zero">0</button>
                <button class="buttons point">.</button>
                <button class="buttons equal">=</button>
                <button class="buttons minus">-</button>
            </div>   
        </div>
    </section>
    <script src="js/index.js"></script>
</body>
</html>
